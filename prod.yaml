# Replace both image :SET_ME values with real immutable @sha256 references before deployment.
apiVersion: v1
kind: Namespace
metadata:
  name: login-demo-prod
  labels:
    app.kubernetes.io/part-of: login-demo
    environment: prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-runtime
  namespace: login-demo-prod
data:
  config.js: |
    window.API_BASE_URL = "";
  nginx.conf: |
    pid /tmp/nginx/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      server_tokens off;
      client_body_temp_path /tmp/nginx/client;
      proxy_temp_path /tmp/nginx/proxy;
      fastcgi_temp_path /tmp/nginx/fastcgi;
      uwsgi_temp_path /tmp/nginx/uwsgi;
      scgi_temp_path /tmp/nginx/scgi;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz { access_log off; return 200 'ok'; }
        location /api/ {
          proxy_pass http://backend:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_connect_timeout 3s;
          proxy_read_timeout 10s;
        }
        location = /config.js { add_header Cache-Control 'no-store' always; }
        location / { try_files $uri $uri/ =404; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: login-demo-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: login-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: login-demo
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: login-demo-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: login-demo
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: login-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: login-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: registry-pull
      containers:
      - name: backend
        image: ghcr.io/shuimuwen/backend:SET_ME
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '8000'
        - name: APP_ENV
          value: prod
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: login-demo-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: login-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: login-demo
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: login-demo-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: login-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: login-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: login-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: registry-pull
      containers:
      - name: frontend
        image: ghcr.io/shuimuwen/frontend:SET_ME
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-tmp
          mountPath: /tmp/nginx
        - name: runtime
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: runtime
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
          readOnly: true
      volumes:
      - name: nginx-tmp
        emptyDir: {}
      - name: runtime
        configMap:
          name: frontend-runtime
