apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: login-demo-dev
resources:
- ../../base
- namespace.yaml
images:
- name: backend
  newName: ghcr.io/shuimuwen/backend
  newTag: SET_ME
- name: frontend
  newName: ghcr.io/shuimuwen/frontend
  newTag: SET_ME
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
    spec:
      template:
        spec:
          containers:
          - name: backend
            env:
            - name: APP_ENV
              value: dev
